name: Verify work-view Python
on:
  push:
    branches: [verify/work-view-python]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c6b07a3911569540a188dac31f216a8c8e2c9fac
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y fish
      - name: Build
        run: npm run build
      - name: Unmodified fast-lane command
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/feature-fast.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-fast-lane
          path: ${{ runner.temp }}/feature-fast.log
